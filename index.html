<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mess Management Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div id="loginDiv" class="card login-card" style="display:none;">
            <h2>Mess Login</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button id="loginBtn" class="btn-primary">Sign In</button>
        </div>

        <div id="appDiv" style="display:none">
            <header class="dashboard-header">
                <div id="personalStats"></div>
                <button onclick="logout()" class="btn-logout">Logout</button>
            </header>

            <nav class="tabs">
                <button class="tab-btn active" onclick="openTab('calendar')">Attendance</button>
                <button class="tab-btn" onclick="openTab('bazar')">Bazar</button>
                <button class="tab-btn" onclick="openTab('summary')">Summary</button>
                <button id="adminBillBtn" class="tab-btn" style="display:none" onclick="openTab('billsTab')">Bills</button>
                <button id="adminTabBtn" class="tab-btn" style="display:none" onclick="openTab('admin')">Admin</button>
            </nav>

            <div id="calendar" class="tab-content">
                <div class="card">
                    <h3>Add Meal</h3>
                    <select id="mealMember"></select>
                    <div class="input-row">
                        <select id="mealDateType" onchange="toggleAdminDate()">
                            <option value="today">Today</option>
                            <option value="tomorrow">Tomorrow</option>
                            <option value="custom" class="admin-only" style="display:none">Custom Date</option>
                        </select>
                        <input type="number" id="mealCount" value="1" min="1">
                    </div>
                    <input type="date" id="mealDate" class="admin-only" style="display:none;">
                    <button onclick="addMeal()" class="btn-primary">Save Meal</button>
                </div>
                <div class="card">
                    <div class="flex-header">
                        <h3>Meal Log</h3>
                        <select id="viewMonth" onchange="fetchData()"></select>
                    </div>
                    <div class="table-scroll">
                        <table id="mealCalendar" class="pro-table"></table>
                    </div>
                </div>
            </div>

            <div id="bazar" class="tab-content" style="display:none">
                <div class="card">
                    <h3>New Bazar Entry</h3>
                    <select id="bazarMember"></select>
                    <div class="input-row">
                        <input type="text" id="bazarItem" placeholder="Item name">
                        <input type="number" id="bazarPrice" placeholder="Price">
                    </div>
                    <div class="admin-only" style="display:none;">
                        <select id="bazarDateType" onchange="toggleBazarAdminDate()">
                            <option value="today">Today</option>
                            <option value="custom">Custom Date</option>
                        </select>
                        <input type="date" id="bazarDate" style="display:none;">
                    </div>
                    <button onclick="addBazar()" class="btn-primary">Add Record</button>
                </div>
                <div class="card">
                    <div id="bazarMemberNav" class="filter-nav"></div>
                    <h4 id="bazarCurrentViewTitle">Records</h4>
                    <div id="bazarListContent" class="bazar-list"></div>
                </div>
            </div>

            <div id="summary" class="tab-content" style="display:none">
                <div id="summaryContent"></div>
            </div>

            <div id="billsTab" class="tab-content" style="display:none">
                <div class="card">
                    <h3>Utility & Final Bills</h3>
                    <div id="billsContent" class="table-scroll"></div>
                </div>
            </div>

            <div id="admin" class="tab-content" style="display:none">
                <div class="card">
                    <div id="adminMemberList" class="filter-nav"></div>
                    <h3 id="adminCurrentTitle">Select Member</h3>
                    <div class="admin-grid">
                        <div>
                            <h4>Meals</h4>
                            <table class="pro-table mini">
                                <tbody id="adminMealBody"></tbody>
                            </table>
                        </div>
                        <div>
                            <h4>Bazar</h4>
                            <table class="pro-table mini">
                                <tbody id="adminBazarBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
