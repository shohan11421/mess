<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Engineers_Hub Mess Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div id="loginDiv" class="card" style="display:none; max-width:400px; margin: 50px auto; text-align: center;">
            <h2>Mess Login</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button id="loginBtn" class="btn-primary">Sign In</button>
        </div>

        <div id="appDiv" style="display:none">
            <header class="dashboard-header">
                <div id="personalStats"></div>
                <button onclick="logout()" class="btn-logout">Logout</button>
            </header>

            <nav class="tabs">
                <button class="tab-btn active" onclick="openTab('calendar')">Attendance</button>
                <button class="tab-btn" onclick="openTab('bazar')">Bazar</button>
                <button class="tab-btn" onclick="openTab('summary')">Summary</button>
                <button id="adminTabBtn" class="tab-btn" style="display:none" onclick="openTab('admin')">Admin</button>
            </nav>

            <div id="calendar" class="tab-content">
                <div class="card compact-form">
                    <h3>Add Meal</h3>
                    <div class="input-group">
                        <select id="mealMember"></select>
                        <input type="number" id="mealCount" value="1" min="1">
                    </div>
                    <select id="mealDateType" onchange="toggleAdminDate()">
                        <option value="today">Today</option>
                        <option value="tomorrow">Tomorrow</option>
                        <option value="custom" class="admin-only" style="display:none">Custom Date</option>
                    </select>
                    <input type="date" id="mealDate" class="admin-only" style="display:none;">
                    <button onclick="addMeal()" class="btn-primary">Save Meal</button>
                </div>
                
                <div class="card no-padding">
                    <div class="card-header-inline">
                        <h3>Meal Log</h3>
                        <select id="viewMonth" onchange="fetchData()" class="month-picker"></select>
                    </div>
                    <div class="table-container">
                        <table id="mealCalendar" class="pro-table"></table>
                    </div>
                </div>
            </div>

            <div id="bazar" class="tab-content" style="display:none">
                <div class="card compact-form">
                    <h3>Add Expense</h3>
                    <select id="bazarMember"></select>
                    <div class="input-group">
                        <input type="text" id="bazarItem" placeholder="Item">
                        <input type="number" id="bazarPrice" placeholder="Price">
                    </div>
                    <button onclick="addBazar()" class="btn-primary">Save Entry</button>
                </div>
                <div id="bazarListContent"></div>
            </div>

            <div id="summary" class="tab-content" style="display:none">
                <div id="summaryContent"></div>
                
                <div id="finalSettlementWrapper" style="display:none; margin-top: 20px;">
                    <div class="summary-black-card" style="background: var(--success);">
                        <p>Final Monthly Bill Settlement</p>
                    </div>
                    <div class="table-container">
                        <table class="summary-table">
                            <thead>
                                <tr>
                                    <th class="name-cell">Member</th>
                                    <th>Meal Bal</th>
                                    <th>Rent</th>
                                    <th>Wifi</th>
                                    <th>Gas</th>
                                    <th>Elect</th>
                                    <th>Khala</th>
                                    <th>Payable</th>
                                </tr>
                            </thead>
                            <tbody id="finalSettlementBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="admin" class="tab-content" style="display:none">
                <div class="card">
                    <h3>Admin Controls</h3>
                    <button id="publishBtn" onclick="toggleSettlement()" class="btn-pub-off">
                        Statement: HIDDEN
                    </button>
                    <div id="adminMemberList" class="member-nav" style="margin-top:15px;"></div>
                </div>
                <div id="adminData"></div>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
