<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineers_Hub Mess Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div id="loginDiv" class="card login-card" style="display:none; max-width:400px; margin: 80px auto;">
            <h2 style="text-align:center">Mess Login</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button id="loginBtn" class="btn-primary">Sign In</button>
        </div>

        <div id="appDiv" style="display:none">
            <header class="dashboard-header">
                <div id="personalStats"></div>
                <button onclick="logout()" class="btn-logout">Logout</button>
            </header>

            <nav class="tabs">
                <button class="tab-btn active" onclick="openTab(event, 'summary')">Summary</button>
                <button class="tab-btn" onclick="openTab(event, 'attendance')">Attendance</button>
                <button class="tab-btn" onclick="openTab(event, 'bazar')">Bazar</button>
                <button id="adminBillBtn" class="tab-btn admin-only" style="display:none" onclick="openTab(event, 'billsTab')">Personal Bills</button>
                <button id="adminTabBtn" class="tab-btn admin-only" style="display:none" onclick="openTab(event, 'admin')">Admin</button>
            </nav>

            <div id="summary" class="tab-content">
                <div id="summaryContent"></div>
            </div>

            <div id="attendance" class="tab-content" style="display:none">
                <div class="card">
                    <h3>Add Meal</h3>
                    <select id="mealMember"></select>
                    <div class="input-group">
                        <select id="mealDateType" onchange="toggleAdminDate()">
                            <option value="today">Today</option>
                            <option value="tomorrow">Tomorrow</option>
                            <option value="custom" class="admin-only" style="display:none">Custom</option>
                        </select>
                        <input type="number" id="mealCount" value="1" min="1">
                    </div>
                    <input type="date" id="mealDate" class="admin-only" style="display:none">
                    <button onclick="addMeal()" class="btn-primary">Save Meal</button>
                </div>
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px">
                        <h3>Meal Log</h3>
                        <select id="viewMonth" onchange="fetchData()" class="month-picker" style="width:auto"></select>
                    </div>
                    <div style="overflow-x:auto"><table id="mealCalendar" class="pro-table"></table></div>
                </div>
            </div>

            <div id="bazar" class="tab-content" style="display:none">
                <div class="card">
                    <h3>New Expense</h3>
                    <select id="bazarMember"></select>
                    <div class="input-group">
                        <input type="text" id="bazarItem" placeholder="Item">
                        <input type="number" id="bazarPrice" placeholder="Price">
                    </div>
                    <button onclick="addBazar()" class="btn-primary">Save Entry</button>
                </div>
                <div id="bazarListContent"></div>
            </div>

            <div id="billsTab" class="tab-content" style="display:none">
                <div class="card">
                    <div class="admin-data-header" style="padding:15px; border-radius:12px 12px 0 0;">
                        <h3 style="margin:0">Bill Calculator</h3>
                        <small>Total = (Bills) - (Meal Status). +Status reduces bill, -Status increases it.</small>
                    </div>
                    <div id="billsContent" class="table-container"></div>
                    <button onclick="window.print()" class="btn-primary" style="margin-top:15px; background:#64748b">Print Report</button>
                </div>
            </div>
            
            <div id="admin" class="tab-content" style="display:none">
                <div id="adminContent">Select a member in the sidebar to manage records.</div>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
