<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineers_Hub Mess Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div id="loginDiv" class="card login-card" style="display:none; max-width:400px; margin: 80px auto;">
            <h2 style="text-align:center">Mess Login</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button id="loginBtn" class="btn-primary">Sign In</button>
        </div>

        <div id="appDiv" style="display:none">
            <header class="dashboard-header">
                <div id="personalStats"></div>
                <button onclick="logout()" class="btn-logout">Logout</button>
            </header>

            <nav class="tabs">
                <button class="tab-btn active" onclick="openTab('calendar')">Attendance</button>
                <button class="tab-btn" onclick="openTab('bazar')">Bazar</button>
                <button class="tab-btn" onclick="openTab('summary')">Summary</button>
                <button id="adminTabBtn" class="tab-btn" style="display:none" onclick="openTab('admin')">Admin</button>
            </nav>

            <div id="calendar" class="tab-content">
                <div class="card">
                    <h3>Add Meal</h3>
                    <select id="mealMember"></select>
                    <div class="input-group">
                        <select id="mealDateType" onchange="toggleAdminDate()">
                            <option value="today">Today</option>
                            <option value="tomorrow">Tomorrow</option>
                            <option value="custom" class="admin-only" style="display:none">Custom Date</option>
                        </select>
                        <input type="number" id="mealCount" value="1" min="1">
                    </div>
                    <input type="date" id="mealDate" class="admin-only" style="display:none; margin-bottom:12px;">
                    <button onclick="addMeal()" class="btn-primary">Save Meal</button>
                </div>
                <div class="card">
                    <div class="flex-between" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px">
                        <h3>Meal Log</h3>
                        <select id="viewMonth" onchange="fetchData()" class="month-picker"></select>
                    </div>
                    <div style="overflow-x:auto"><table id="mealCalendar" class="pro-table"></table></div>
                </div>
            </div>

            <div id="bazar" class="tab-content" style="display:none">
                <div class="card">
                    <h3>Add New Expense</h3>
                    <select id="bazarMember"></select>
                    <div class="input-group">
                        <input type="text" id="bazarItem" placeholder="Item name">
                        <input type="number" id="bazarPrice" placeholder="Price (৳)">
                    </div>
                    <select id="bazarDateType" class="admin-only" style="display:none; margin-bottom:12px;" onchange="toggleBazarAdminDate()">
                        <option value="today">Today</option>
                        <option value="custom">Custom Date</option>
                    </select>
                    <input type="date" id="bazarDate" class="admin-only" style="display:none; margin-bottom:12px;">
                    
                    <button onclick="addBazar()" class="btn-primary">Save Entry</button>
                </div>

                <div class="admin-layout">
                    <aside class="admin-sidebar">
                        <h4>Members</h4>
                        <div id="bazarMemberNav" class="member-nav"></div>
                        <button onclick="filterBazarByMember('ALL')" class="btn-all-list">View All List</button>
                    </aside>
                    <main class="admin-main">
                        <div class="admin-data-header"><h3 id="bazarCurrentViewTitle">Expense List</h3></div>
                        <div class="card" style="padding:10px;"><div id="bazarListContent" class="admin-scroll"></div></div>
                    </main>
                </div>
            </div>

            <div id="summary" class="tab-content" style="display:none">
                <div id="summaryContent"></div>
            </div>

            <div id="admin" class="tab-content" style="display:none">
                <div class="admin-layout">
                    <aside class="admin-sidebar">
                        <h4>Manage</h4>
                        <div id="adminMemberList" class="member-nav"></div>
                    </aside>
                    <main class="admin-main">
                        <div class="admin-data-header"><h3 id="adminCurrentTitle">Select Member</h3></div>
                        <div class="admin-grid-view">
                            <div class="card admin-card">
                                <div class="card-header"><h4>Meal Records</h4></div>
                                <div class="admin-scroll"><table class="pro-table mini-table"><tbody id="adminMealBody"></tbody></table></div>
                            </div>
                            <div class="card admin-card">
                                <div class="card-header"><h4>Bazar Records</h4></div>
                                <div class="admin-scroll"><table class="pro-table mini-table"><tbody id="adminBazarBody"></tbody></table></div>
                            </div>
                        </div>
                        <div class="card admin-card" style="margin-top: 20px; border-top: 4px solid #10b981;">
    <div class="card-header"><h4>Utilities & Rent (Fixed Costs)</h4></div>
    <div class="input-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px;">
        <input type="number" id="rent" placeholder="Room Rent">
        <input type="number" id="wifi" placeholder="Wifi Bill">
        <input type="number" id="gas" placeholder="Gas Bill">
        <input type="number" id="electricity" placeholder="Electricity">
        <input type="number" id="khala" placeholder="Khala Bill">
    </div>
    <button onclick="calculateFinalSettlement()" class="btn-primary" style="background: #10b981;">Calculate Final Dues</button>
</div>

<div id="settlementSection" class="card" style="display:none; margin-top: 20px; border: 2px solid #10b981; padding: 0; overflow: hidden;">
    <div class="admin-data-header" style="background: #059669; border-radius: 0;">
        <h3 style="color: white; margin: 0;">Final Monthly Settlement</h3>
    </div>
    <div style="overflow-x:auto">
        <table class="summary-table">
            <thead>
                <tr>
                    <th style="text-align:left; padding-left:15px;">MEMBER</th>
                    <th>FIXED (A)</th>
                    <th>MEAL BAL (B)</th>
                    <th>FINAL PAY</th>
                </tr>
            </thead>
            <tbody id="settlementBody"></tbody>
        </table>
    </div>
</div>
                    </main>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
